# Copy to ~/.config/vpsfarm/config.toml and fill in.
# Env vars with the VPSFARM_ prefix override every key here.

data_dir = "~/.local/share/vpsfarm"

# --- mail ---------------------------------------------------------------
# cloudflare | maildrop | dropmail | guerrilla
mail_provider = "cloudflare"
mail_domain = "example.com"
mail_worker_url = "https://mail.example.workers.dev"
mail_secret = ""

# --- sms ----------------------------------------------------------------
# 5sim | sms-activate
sms_provider = "5sim"
sms_key = ""
sms_country = "vietnam"
sms_product = "other"

# --- captcha ------------------------------------------------------------
# capsolver | 2captcha | yescaptcha | nopecha
captcha_provider = "capsolver"
captcha_key = ""

# --- browser ------------------------------------------------------------
# Sticky per identity. socks5://user:pass@host:port or http://host:port
proxy = ""
headless = false
browser_engine = "patchright"   # patchright | camoufox

# --- aws ----------------------------------------------------------------
aws_region = "ap-southeast-1"
aws_instance_type = "t3.small"

# --- oracle -------------------------------------------------------------
oci_config = "~/.oci/config"
oci_profile = "DEFAULT"
oci_compartment = ""
oci_shape = "VM.Standard.A1.Flex"
oci_ocpus = 4
oci_memory_gb = 24

# --- azure --------------------------------------------------------------
azure_location = "southeastasia"
azure_vm_size = "Standard_B2ats_v2"
