<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link4M ProMax</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .title {
      font-weight: 800;
      font-size: 14px;
      background: linear-gradient(135deg, #00f0ff, #ff0080);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(0, 240, 255, 0.2);
      color: #00f0ff;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card {
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .label { color: #8b949e; }
    .val { font-weight: 600; color: #58a6ff; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      color: #030712;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .footer {
      font-size: 10px;
      color: #6e7681;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ LINK4M PROMAX</div>
    <div class="badge">CHROME EXT</div>
  </div>

  <div class="card">
    <div class="card-row">
      <span class="label">Nhiệm vụ:</span>
      <span class="val" id="pop-status">Chờ link...</span>
    </div>
    <div class="card-row">
      <span class="label">Nhà tài trợ:</span>
      <span class="val" id="pop-domain">--</span>
    </div>
    <div class="card-row">
      <span class="label">Mã vừa lấy:</span>
      <span class="val" id="pop-code" style="color: #4ade80;">--</span>
    </div>
  </div>

  <button class="btn" id="btn-reload">F5 Làm Mới Trang Hiện Tại</button>
  <button class="btn btn-secondary" id="btn-reset">Đặt Lại Phiên (Reset)</button>

  <div class="footer">Chạy trực tiếp trên trình duyệt thật của bạn • Tự động 100%</div>

  <script src="popup.js"></script>
</body>
</html>
