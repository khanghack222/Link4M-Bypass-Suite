# /etc/nginx/sites-available/bypass-rs
# ln -s /etc/nginx/sites-available/bypass-rs /etc/nginx/sites-enabled/

upstream bypass_rs {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name bypass.example.com;

    # Chỉ mở HTTPS thật thì bỏ comment khối này
    # return 301 https://$host$request_uri;

    client_max_body_size 1m;
    client_body_timeout 15s;

    # Job Link4M có thể chạy 8 phút; proxy_read_timeout phải dài hơn JOB_TIMEOUT
    proxy_connect_timeout 5s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://bypass_rs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check rẻ, không qua hàng đợi
    location = /health {
        proxy_pass http://bypass_rs/health;
        access_log off;
    }
}
