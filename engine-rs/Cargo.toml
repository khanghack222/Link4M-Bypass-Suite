[package]
name = "l4m-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json", "socks-proxy"] }
url = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whisper-rs = { version = "0.14", optional = true }
whisper-rs-sys = { version = "0.13", optional = true }

[features]
default = ["local-asr"]
# Local whisper.cpp. Disable with `--no-default-features` and set `ASR_URL`
# to build without cmake, g++, or the whisper model.
local-asr = ["dep:whisper-rs", "dep:whisper-rs-sys"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Iteration profile: same optimisation level, no LTO and parallel codegen.
# Live smoke runs use this; the shipped binary still uses `release`.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
