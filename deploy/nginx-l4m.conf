# /etc/nginx/sites-available/l4m-bypass
# Chống spam + chuyển tiếp tới service. Bật Cloudflare Turnstile ở biên nếu
# mở công khai (khuyến nghị), vì máy bypass Chrome rất tốn tài nguyên.
limit_req_zone $binary_remote_addr zone=l4m:10m rate=20r/m;

server {
    listen 80;
    server_name bypass.example.com;

    client_max_body_size 64k;

    location / {
        limit_req zone=l4m burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Bypass một link có thể mất tới ~4 phút (wait=1)
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
        proxy_connect_timeout 10s;
    }

    location = /health { proxy_pass http://127.0.0.1:8080/health; access_log off; }
}
